name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build \
            -f backend/src/SIMS.API/Dockerfile \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/sims-api:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/sims-api:latest \
            backend/
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/sims-api:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/sims-api:latest

      - name: Build and push Frontend image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/sims-frontend:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/sims-frontend:latest \
            frontend/
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/sims-frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/sims-frontend:latest

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sims-api-test
          images: ${{ secrets.ACR_NAME }}.azurecr.io/sims-api:${{ github.sha }}

      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sims-frontend-test
          images: ${{ secrets.ACR_NAME }}.azurecr.io/sims-frontend:${{ github.sha }}
