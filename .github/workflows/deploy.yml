name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend build
        run: dotnet build backend/SIMS.sln --no-incremental -v q

      - name: Backend tests
        run: |
          dotnet test backend/tests/SIMS.Application.Tests/SIMS.Application.Tests.csproj --no-build --verbosity minimal
          dotnet test backend/tests/SIMS.Application.Rating.Tests/SIMS.Application.Rating.Tests.csproj --no-build --verbosity minimal

      - name: Backend vulnerability audit
        # Scoped to the deployable API project (which transitively covers Application,
        # Infrastructure, and Domain) rather than the whole solution, so test-only
        # advisories with no available fix — e.g. CVE-2025-6965 on the SQLite native
        # lib pulled by the test project's EFCore.Sqlite — do not block production
        # deploys. All shipped code is still audited.
        run: dotnet list backend/src/SIMS.API/SIMS.API.csproj package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt; grep -q "has the following vulnerable packages" /tmp/vuln.txt && exit 1 || true

      - name: Frontend install
        run: npm install
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR login server
        run: echo "ACR_LOGIN_SERVER=$(az acr show --name ${{ secrets.ACR_NAME }} --query loginServer -o tsv)" >> $GITHUB_ENV

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Mirror .NET base images to ACR
        run: |
          az acr import \
            --name ${{ secrets.ACR_NAME }} \
            --source mcr.microsoft.com/dotnet/aspnet:8.0 \
            --image dotnet/aspnet:8.0 \
            --force
          az acr import \
            --name ${{ secrets.ACR_NAME }} \
            --source mcr.microsoft.com/dotnet/sdk:8.0 \
            --image dotnet/sdk:8.0 \
            --force

      - name: Build and push API image
        run: |
          docker build \
            -f backend/src/SIMS.API/Dockerfile \
            --build-arg ASPNET_IMAGE=${{ env.ACR_LOGIN_SERVER }}/dotnet/aspnet:8.0 \
            --build-arg SDK_IMAGE=${{ env.ACR_LOGIN_SERVER }}/dotnet/sdk:8.0 \
            -t ${{ env.ACR_LOGIN_SERVER }}/sims-api:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/sims-api:latest \
            backend/
          docker push ${{ env.ACR_LOGIN_SERVER }}/sims-api:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/sims-api:latest

      - name: Build and push Frontend image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/sims-frontend:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/sims-frontend:latest \
            frontend/
          docker push ${{ env.ACR_LOGIN_SERVER }}/sims-frontend:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/sims-frontend:latest

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sims-api-test
          images: ${{ env.ACR_LOGIN_SERVER }}/sims-api:${{ github.sha }}

      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sims-frontend-test
          images: ${{ env.ACR_LOGIN_SERVER }}/sims-frontend:${{ github.sha }}

      - name: Smoke test — API health
        run: |
          echo "Waiting for API to become healthy..."
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://sims-api-test.azurewebsites.net/health/ready || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: API did not become healthy after 3 minutes."
          exit 1

      - name: Smoke test — Frontend reachable
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://sims-frontend-test.azurewebsites.net/ || echo "000")
          echo "Frontend HTTP $status"
          if [ "$status" != "200" ] && [ "$status" != "304" ]; then
            echo "ERROR: Frontend returned $status"
            exit 1
          fi
          echo "Frontend is reachable."
